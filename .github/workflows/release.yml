# Build FlipLauncher from a version tag (v0.7.1) and attach the APK to a GitHub release.
# Manual runs build and test only, and upload the APK as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FLIPLAUNCHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::FLIPLAUNCHER_KEYSTORE_BASE64 is not set; publishing a debug-signed APK."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build
        env:
          FLIPLAUNCHER_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          FLIPLAUNCHER_KEYSTORE_PASSWORD: ${{ secrets.FLIPLAUNCHER_KEYSTORE_PASSWORD }}
          FLIPLAUNCHER_KEY_ALIAS: ${{ secrets.FLIPLAUNCHER_KEY_ALIAS }}
          FLIPLAUNCHER_KEY_PASSWORD: ${{ secrets.FLIPLAUNCHER_KEY_PASSWORD }}
        run: |
          variant=${{ steps.signing.outputs.variant }}
          ./gradlew :app:testDebugUnitTest ":app:assemble${variant^}"
          mkdir -p dist
          suffix=$([ "$variant" = debug ] && echo "-debug" || true)
          cp "app/build/outputs/apk/$variant/app-$variant.apk" \
            "dist/FlipLauncher-${{ steps.version.outputs.name }}$suffix.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FlipLauncher-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--prerelease" || true)
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "FlipLauncher ${{ steps.version.outputs.name }}" --generate-notes $prerelease
