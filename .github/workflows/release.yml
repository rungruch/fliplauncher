# Build FlipLauncher from a version tag (v0.7.1) and attach the APK to a GitHub release.
# Manual runs build and test only, and upload the APK as a workflow artifact.
# APKs are debug-signed with the keystore in FLIPLAUNCHER_DEBUG_KEYSTORE_BASE64, so every
# release installs over the previous one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "name=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Install debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.FLIPLAUNCHER_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Set the FLIPLAUNCHER_DEBUG_KEYSTORE_BASE64 secret so releases share one signing key"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Test and build
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FlipLauncher-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: FlipLauncher-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo "--prerelease" || true)
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "FlipLauncher ${{ steps.version.outputs.name }}" --generate-notes $prerelease
